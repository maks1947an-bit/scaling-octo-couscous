<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeus Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#090909;--card:#151515;--card2:#1c1c1c;--text:#f5f0e8;--muted:#858585;--gold:#c99b50;--gold2:#e4bd77;--border:#292929;--danger:#d66b60}
body.light{--bg:#eeeae2;--card:#fff;--card2:#f4f0e8;--text:#211e19;--muted:#77716a;--border:#ded7ca}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;transition:.25s}
button,input{font:inherit}button{cursor:pointer}
svg.lucide{width:18px;height:18px;flex-shrink:0}
#loader{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:#080808 url("zeus.jpg") center 30%/cover;transition:opacity .7s}
#loader:after{content:"";position:absolute;inset:0;background:#0007}
.loader-content{position:relative;z-index:2;text-align:center}
.loader-content h1{font-size:43px;letter-spacing:8px;color:var(--gold2)}
.loader-content p{letter-spacing:5px;margin-top:8px}
.loader-line{height:2px;width:150px;background:#555;margin:25px auto;overflow:hidden}
.loader-line span{display:block;width:40%;height:100%;background:var(--gold);animation:load 1s infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(400%)}}
.hidden{display:none!important}

/* Авторизация и экраны */
.auth-bg{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(#0009,#000d),url("zeus.jpg") center/cover fixed}
.card{background:var(--card);border:1px solid var(--border);border-radius:19px;padding:25px;width:100%;max-width:450px;box-shadow:0 15px 60px #0008}
.logo{text-align:center;font-size:31px;font-weight:900;letter-spacing:3px}
.logo span{color:var(--gold)}
.subtitle{color:var(--muted);text-align:center;margin:9px 0 25px}
.tabs{display:flex;border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:20px}
.tabs button{flex:1;background:transparent;color:var(--muted);border:0;padding:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button.active{color:var(--gold2);border:1px solid var(--gold)}
.field{margin-bottom:13px;position:relative}
.field>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--gold);width:18px;height:18px}
.field input{width:100%;padding:16px 16px 16px 46px;border-radius:11px;border:1px solid var(--border);background:var(--card2);color:var(--text);outline:none}
.field input:focus{border-color:var(--gold)}
.main-btn{width:100%;padding:16px;background:linear-gradient(110deg,#ae803c,#e1b668);border:0;border-radius:11px;font-weight:bold;color:#15110b;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.message{color:var(--gold2);text-align:center;font-size:13px;margin-top:14px;min-height:17px}

/* Капча */
.captcha-row{display:flex;gap:10px;margin-bottom:13px}
.captcha-q{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px dashed var(--gold);border-radius:11px;font-size:24px;font-weight:bold;letter-spacing:4px;color:var(--gold2);user-select:none}
.icon-btn{width:54px;background:var(--card2);color:var(--gold);border:1px solid var(--border);border-radius:11px;display:flex;align-items:center;justify-content:center}

/* Язык */
.lang-btn{width:100%;display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:11px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:11px;font-size:16px}
.lang-btn:hover{border-color:var(--gold)}
.lang-btn .flag{font-size:24px}

/* Баннеры */
.overlay{position:fixed;inset:0;z-index:1500;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px}
.banner-icon{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;background:#322719;color:var(--gold2);display:flex;align-items:center;justify-content:center}
.banner-icon svg{width:28px;height:28px}
.banner h2{text-align:center;font-size:20px;margin-bottom:12px}
.banner p{color:var(--muted);font-size:13px;line-height:1.6;text-align:center}
.banner ul{list-style:none;margin:14px 0 6px}
.banner li{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:9px}
.banner li svg{color:var(--gold)}
.big-percent{text-align:center;font-size:34px;font-weight:900;color:var(--gold2);margin:4px 0 10px}

/* Приложение */
#app{min-height:100vh;padding-bottom:95px}
.topbar{height:72px;padding:0 20px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.top-logo{font-size:22px;font-weight:900;letter-spacing:2px}
.top-logo span{color:var(--gold)}
.top-city{color:var(--muted);font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
.top-city svg{width:12px;height:12px;color:var(--gold)}
.top-icon{width:40px;height:40px;border:1px solid var(--border);background:var(--card2);color:var(--gold);border-radius:11px;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:1050px;margin:auto;padding:24px 17px}
.section-title{font-size:25px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.section-title svg{width:24px;height:24px;color:var(--gold)}
.section-subtitle{font-size:13px;color:var(--muted);margin-bottom:23px}

/* Товары */
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.product{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px;transition:.2s}
.product{cursor:pointer}
.product:hover{border-color:var(--gold);transform:translateY(-2px)}
.product-icon{position:relative;height:105px;border-radius:11px;background:linear-gradient(135deg,#28221a,#100f0d);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--gold)}
.product-icon>svg{width:43px;height:43px}
.plogo{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);background:#000}
.product h3{font-size:16px;margin-bottom:9px}
.product p{color:var(--muted);font-size:12px;line-height:1.5;min-height:54px}
.product-tag{display:inline-flex;align-items:center;gap:4px;color:var(--gold2);font-size:10px;letter-spacing:1px;margin-top:12px;text-transform:uppercase}
.product-tag svg{width:11px;height:11px}

.price{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:18px;font-weight:bold;color:var(--gold2)}
.price small{margin-left:auto;font-size:11px;font-weight:normal;color:var(--muted)}
.price svg{width:15px;height:15px}
.price+.product-tag{margin-top:6px}
/* Баланс */
.balance-card{background:linear-gradient(130deg,#302317,#17130e);border:1px solid #75552e;border-radius:18px;padding:27px 22px;margin:20px 0}
.balance-label{color:#c4aa82;font-size:13px;display:flex;align-items:center;gap:7px}
.balance-value{font-size:36px;font-weight:bold;margin:15px 0 8px;color:#edc77f}
.balance-description{font-size:12px;color:#a9997e}
.topup-btn{margin-top:18px;width:auto;padding:13px 22px}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:14px}
.info-card h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.info-card h3 svg{color:var(--gold)}
.info-card p{font-size:13px;color:var(--muted);line-height:1.6}

/* Пополнение */
.method{width:100%;display:flex;align-items:center;gap:13px;padding:14px;margin-bottom:10px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:11px;text-align:left}
.method.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.method .m-ico{width:38px;height:38px;border-radius:10px;background:#322719;color:var(--gold2);display:flex;align-items:center;justify-content:center}
.method small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.method .check{margin-left:auto;color:var(--gold);opacity:0}
.method.active .check{opacity:1}
.cancel-btn{width:100%;padding:13px;margin-top:10px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:11px}

.addr{font-family:monospace;font-size:12px;word-break:break-all;background:var(--card2);border:1px dashed var(--gold);border-radius:10px;padding:13px;margin:12px 0;color:var(--gold2)}
.pay-box .main-btn{margin-top:0;margin-bottom:10px}
/* Профиль */
.profile-head{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:20px;margin-bottom:18px}
.avatar{width:55px;height:55px;background:#322719;color:var(--gold2);display:flex;justify-content:center;align-items:center;border-radius:50%}
.avatar svg{width:26px;height:26px}
.profile-head p{color:var(--muted);font-size:12px;margin-top:5px}
.setting{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.setting-info{display:flex;align-items:center;gap:12px}
.setting-info>svg{color:var(--gold)}
.setting-info strong{font-size:14px}
.setting-info small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.setting button{background:var(--card2);color:var(--gold2);border:1px solid var(--border);border-radius:9px;padding:10px 13px}
select{background:var(--card2);color:var(--text);padding:10px;border:1px solid var(--border);border-radius:9px}
.logout{width:100%;padding:15px;background:transparent;border:1px solid #743c35;color:var(--danger);border-radius:12px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}

/* Нижнее меню */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;font-size:11px}
.nav-btn svg{width:21px;height:21px}
.nav-btn.active{color:var(--gold2)}
.nav-btn.active svg{filter:drop-shadow(0 0 5px #c99b5080)}

.city-result{background:var(--card2);border:1px solid var(--border);padding:13px;border-radius:9px;margin-top:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:9px}
.city-result svg{color:var(--gold);width:15px;height:15px}
.city-result:hover{border-color:var(--gold)}
@media(min-width:650px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:950px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-content">
    <h1>ZEUS</h1><p>SHOP</p>
    <div class="loader-line"><span></span></div>
  </div>
</div>

<!-- Капча -->
<div class="auth-bg hidden" id="captchaScreen">
  <div class="card">
    <div class="logo">ZEUS <span>SHOP</span></div>
    <div class="subtitle">Проверка · Перевірка · Weryfikacja</div>
    <div class="captcha-row">
      <div class="captcha-q"><i data-lucide="shield-question"></i><span id="captchaQ"></span></div>
      <button class="icon-btn" onclick="newCaptcha()"><i data-lucide="refresh-cw"></i></button>
    </div>
    <div class="field">
      <i data-lucide="hash"></i>
      <input id="captchaInput" type="number" inputmode="numeric" placeholder="?">
    </div>
    <button class="main-btn" onclick="checkCaptcha()"><i data-lucide="check"></i><span>OK</span></button>
    <div class="message" id="captchaMessage"></div>
  </div>
</div>

<!-- Выбор языка -->
<div class="auth-bg hidden" id="langScreen">
  <div class="card">
    <div class="logo">ZEUS <span>SHOP</span></div>
    <div class="subtitle"><i data-lucide="languages" style="vertical-align:middle"></i> Мова · Język · Язык</div>
    <button class="lang-btn" onclick="chooseLang('uk')"><span class="flag">🇺🇦</span>Українська</button>
    <button class="lang-btn" onclick="chooseLang('pl')"><span class="flag">🇵🇱</span>Polski</button>
    <button class="lang-btn" onclick="chooseLang('ru')"><span class="flag">🌐</span>Русский</button>
  </div>
</div>

<!-- Политика конфиденциальности -->
<div class="overlay hidden" id="privacyBanner">
  <div class="card banner">
    <div class="banner-icon"><i data-lucide="lock-keyhole"></i></div>
    <h2 data-i18n="privTitle"></h2>
    <p data-i18n="privText"></p>
    <ul>
      <li><i data-lucide="user-round"></i><span data-i18n="priv1"></span></li>
      <li><i data-lucide="eye-off"></i><span data-i18n="priv2"></span></li>
      <li><i data-lucide="trash-2"></i><span data-i18n="priv3"></span></li>
    </ul>
    <button class="main-btn" onclick="acceptPrivacy()"><i data-lucide="check-circle-2"></i><span data-i18n="accept"></span></button>
  </div>
</div>

<!-- Баннер комиссии -->
<div class="overlay hidden" id="commissionBanner">
  <div class="card banner">
    <div class="banner-icon"><i data-lucide="badge-percent"></i></div>
    <h2 data-i18n="commTitle"></h2>
    <div class="big-percent"><i data-lucide="trending-down" style="vertical-align:middle"></i> <span data-i18n="commBig"></span></div>
    <p data-i18n="commText"></p>
    <button class="main-btn" onclick="closeCommission()"><i data-lucide="sparkles"></i><span data-i18n="great"></span></button>
  </div>
</div>

<!-- Карточка товара -->
<div class="overlay hidden" id="productModal" onclick="if(event.target===this)closeProduct()">
  <div class="card banner">
    <div class="banner-icon" id="pmIcon"></div>
    <h2 id="pmName"></h2>
    <p id="pmDesc"></p>
    <div class="big-percent" id="pmPrice" style="margin-top:14px"></div>
    <button class="main-btn" onclick="buyProduct()"><i data-lucide="shopping-cart"></i><span data-i18n="buy"></span></button>
    <button class="main-btn hidden" id="pmTopup" onclick="closeProduct();showPage('balance');openTopup()"><i data-lucide="circle-plus"></i><span data-i18n="topup"></span></button>
    <div class="message" id="pmMessage"></div>
    <button class="cancel-btn" onclick="closeProduct()" data-i18n="close"></button>
  </div>
</div>

<!-- Пополнение -->
<div class="overlay hidden" id="topupModal">
  <div class="card banner">
    <div class="banner-icon"><i data-lucide="circle-plus"></i></div>
    <h2 data-i18n="topup"></h2>
    <p style="margin-bottom:16px" data-i18n="topupChoose"></p>
    <div id="methods"></div>
    <div class="field">
      <i data-lucide="coins"></i>
      <input id="topupAmount" type="number" min="1" data-ph="amount">
    </div>
    <button class="main-btn" onclick="confirmTopup()"><i data-lucide="arrow-right"></i><span data-i18n="continue"></span></button>
    <div class="message" id="topupMessage"></div>
    <div id="payBox" class="info-card pay-box hidden">
      <p id="payNote"></p>
      <div class="addr" id="payAddr"></div>
      <button class="main-btn" onclick="copyAddr()"><i data-lucide="copy"></i><span data-i18n="copy"></span></button>
      <div class="field"><i data-lucide="hash"></i><input id="payTx" data-ph="txid"></div>
      <button class="main-btn" onclick="claimPay()"><i data-lucide="send"></i><span data-i18n="iPaid"></span></button>
    </div>
    <button class="cancel-btn" onclick="closeTopup()" data-i18n="close"></button>
  </div>
</div>

<!-- Авторизация -->
<div class="auth-bg hidden" id="authScreen">
  <div class="card">
    <div class="logo">ZEUS <span>SHOP</span></div>
    <div class="subtitle" data-i18n="welcome"></div>
    <div class="tabs">
      <button id="loginTab" class="active" onclick="setMode('login')"><i data-lucide="log-in"></i><span data-i18n="login"></span></button>
      <button id="registerTab" onclick="setMode('register')"><i data-lucide="user-plus"></i><span data-i18n="register"></span></button>
    </div>
    <div class="field"><i data-lucide="user-round"></i><input id="username" data-ph="loginPh"></div>
    <div class="field"><i data-lucide="lock"></i><input id="password" type="password" data-ph="passPh"></div>
    <div class="field hidden" id="confirmField"><i data-lucide="shield-check"></i><input id="confirmPassword" type="password" data-ph="confirmPh"></div>
    <button class="main-btn" onclick="submitAuth()"><i data-lucide="arrow-right-to-line"></i><span id="authButton" data-i18n="enter"></span></button>
    <div class="message" id="authMessage"></div>
  </div>
</div>

<!-- Выбор города -->
<div class="auth-bg hidden" id="cityScreen">
  <div class="card">
    <div class="logo">ZEUS <span>SHOP</span></div>
    <div class="subtitle" data-i18n="cityTitle"></div>
    <div class="field"><i data-lucide="map-pin"></i><input id="cityInput" data-ph="cityPh"></div>
    <div id="cityResults"></div>
    <div class="message" id="cityMessage"></div>
  </div>
</div>

<!-- Приложение -->
<div id="app" class="hidden">
  <header class="topbar">
    <div>
      <div class="top-logo">ZEUS <span>SHOP</span></div>
      <div class="top-city"><i data-lucide="map-pin"></i><span id="headerCity"></span></div>
    </div>
    <button class="top-icon" onclick="showPage('profile')"><i data-lucide="user-round"></i></button>
  </header>

  <section class="container page-section" id="productsPage">
    <h1 class="section-title"><i data-lucide="store"></i><span data-i18n="ourProducts"></span></h1>
    <p class="section-subtitle" data-i18n="productsSub"></p>
    <div class="products" id="productsGrid"></div>
  </section>

  <section class="container page-section hidden" id="balancePage">
    <h1 class="section-title"><i data-lucide="wallet"></i><span data-i18n="myBalance"></span></h1>
    <p class="section-subtitle" data-i18n="balanceSub"></p>
    <div class="balance-card">
      <div class="balance-label"><i data-lucide="coins"></i><span data-i18n="curBalance"></span></div>
      <div class="balance-value" id="balanceValue">0.00 $</div>
      <div class="balance-description" data-i18n="demoBal"></div>
      <button class="main-btn topup-btn" onclick="openTopup()"><i data-lucide="circle-plus"></i><span data-i18n="topup"></span></button>
    </div>
    <div class="info-card">
      <h3><i data-lucide="piggy-bank"></i><span data-i18n="myFunds"></span></h3>
      <p data-i18n="fundsText"></p>
    </div>
    <div class="info-card">
      <h3><i data-lucide="history"></i><span data-i18n="history"></span></h3>
      <p data-i18n="noOps"></p>
    </div>
  </section>

  <section class="container page-section hidden" id="profilePage">
    <h1 class="section-title"><i data-lucide="user-cog"></i><span data-i18n="myProfile"></span></h1>
    <p class="section-subtitle" data-i18n="profileSub"></p>
    <div class="profile-head">
      <div class="avatar"><i data-lucide="user-round"></i></div>
      <div><h3 id="profileName"></h3><p id="profileCity"></p></div>
    </div>

    <div class="setting">
      <div class="setting-info"><i data-lucide="palette"></i>
        <div><strong data-i18n="theme"></strong><small data-i18n="themeSub"></small></div></div>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="dark" data-i18n="dark"></option>
        <option value="light" data-i18n="light"></option>
      </select>
    </div>

    <div class="setting">
      <div class="setting-info"><i data-lucide="languages"></i>
        <div><strong data-i18n="language"></strong><small data-i18n="languageSub"></small></div></div>
      <select id="langSelect" onchange="chooseLang(this.value,true)">
        <option value="uk">Українська</option>
        <option value="pl">Polski</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="setting">
      <div class="setting-info"><i data-lucide="map-pin"></i>
        <div><strong data-i18n="myCity"></strong><small id="currentCity"></small></div></div>
      <button onclick="openCityChange()" data-i18n="change"></button>
    </div>

    <div id="cityChangeBox" class="info-card hidden">
      <h3><i data-lucide="map-pinned"></i><span data-i18n="changeCity"></span></h3>
      <div class="field"><i data-lucide="search"></i><input id="newCityInput" data-ph="enterCity"></div>
      <div id="newCityResults"></div>
      <div class="message" id="newCityMessage"></div>
    </div>

    <div class="setting">
      <div class="setting-info"><i data-lucide="wallet"></i>
        <div><strong data-i18n="balance"></strong><small data-i18n="myFundsShort"></small></div></div>
      <button onclick="showPage('balance')" data-i18n="open"></button>
    </div>

    <button class="logout" onclick="logout()"><i data-lucide="log-out"></i><span data-i18n="logout"></span></button>
  </section>
</div>

<nav class="bottom-nav hidden" id="bottomNav">
  <button class="nav-btn active" data-page="products" onclick="showPage('products')"><i data-lucide="shopping-bag"></i><span data-i18n="navProducts"></span></button>
  <button class="nav-btn" data-page="balance" onclick="showPage('balance')"><i data-lucide="wallet"></i><span data-i18n="navBalance"></span></button>

/* Цены заданы в злотых (PLN), мин. чек 100 zł. Курсы приблизительные — меняй здесь (и в bot.py). */
const PLN_PER_USD = 3.7;
const CURRENCY = {
  pl:{rate:1,    step:1,  sym:"zł",  loc:"pl-PL"},
  uk:{rate:11.5, step:10, sym:"грн", loc:"uk-UA"},
  ru:{rate:21,   step:50, sym:"₽",   loc:"ru-RU"}
};
function price(pln) {
  const c = CURRENCY[lang] || CURRENCY.ru;
  const v = Math.round(pln * c.rate / c.step) * c.step;
  return new Intl.NumberFormat(c.loc, {maximumFractionDigits:0}).format(v) + " " + c.sym;
}
const usd = pln => (Math.round(pln / PLN_PER_USD * 100) / 100).toFixed(2);
const PRODUCTS = [
 ["crown","Zeus Cocaine","p1","Premium",160],["shield-check","Zeus Xanax","p2","Quality",100],
 ["gem","Golden MDMA","p3","Exclusive",100],["zap","Thunder Crystal","p4","Popular",100],
 ["star","Zeus Standard Hash","p5","Standard",140],["flame","Inferno THC 48%","p6","Limited",140],
 ["package","Zeus Mefedron","p7","Ultimate",180]];

function renderProducts() {
  $("productsGrid").innerHTML = PRODUCTS.map((p, i) => `
    <article class="product" onclick="openProduct(${i})">
      <div class="product-icon">
        <img class="plogo" src="logo.jpg" alt="" onerror="this.style.display='none'">
        <i data-lucide="${p[0]}"></i>
      </div>
      <h3>${p[1]}</h3><p>${t(p[2])}</p>
      <div class="price"><i data-lucide="tag"></i>${price(p[4])}<small>≈ ${usd(p[4])} $</small></div>
      <span class="product-tag"><i data-lucide="sparkle"></i>${p[3]}</span>
    </article>`).join("");
}

function renderMethods() {
  const list = [["tonkeeper","diamond","Tonkeeper","Bitcoin · BTC"],["cryptobot","bot","CryptoBot","Telegram · All crypto"],["trustwallet","shield-check","Trust Wallet","TON"]];
  $("methods").innerHTML = list.map(m => `
    <button class="method ${method===m[0]?"active":""}" onclick="pickMethod('${m[0]}')">
      <span class="m-ico"><i data-lucide="${m[1]}"></i></span>
      <span><strong>${m[2]}</strong><small>${m[3]}</small></span>
      <i class="check" data-lucide="check-circle-2"></i>
    </button>`).join("");
}

function applyLang() {
  document.documentElement.lang = lang || "ru";
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
  $("langSelect").value = lang || "ru";
  setMode(mode);
  renderProducts(); renderMethods(); updateProfile();
  icons();
}

function chooseLang(l, fromProfile) {
  lang = l;
  localStorage.setItem("zeusLang", l);
  applyLang();
  if (!fromProfile) { $("langScreen").classList.add("hidden"); route(); }
}

/* ===== Капча ===== */
function newCaptcha() {
  const a = 2 + Math.floor(Math.random()*8), b = 2 + Math.floor(Math.random()*8);
  captchaAnswer = a + b;
  $("captchaQ").textContent = a + " + " + b + " = ?";
  $("captchaInput").value = "";
  $("captchaMessage").textContent = "";
}

function checkCaptcha() {
  if (Number($("captchaInput").value) === captchaAnswer) {
    sessionStorage.setItem("zeusCaptcha","1");
    $("captchaScreen").classList.add("hidden");
    route();
  } else {
    $("captchaMessage").textContent = "✕";
    newCaptcha();
    $("captchaMessage").textContent = "✕";
  }
}

function acceptPrivacy() {

  route();
}

function closeCommission() { $("commissionBanner").classList.add("hidden"); }

/* ===== Пополнение ===== */
function openTopup() { method = null; $("payBox").classList.add("hidden"); $("topupAmount").value = ""; $("topupMessage").textContent = ""; renderMethods(); icons(); $("topupModal").classList.remove("hidden"); }
function closeTopup() { $("topupModal").classList.add("hidden"); }
function pickMethod(m) { method = m; renderMethods(); icons(); }
let payInfo = null, pollTimer = null;
async function confirmTopup() {
  const amount = Number($("topupAmount").value), msg = $("topupMessage");
  $("payBox").classList.add("hidden");
  if (!method) { msg.textContent = t("pickMethod"); return; }
  if (!(amount >= 1)) { msg.textContent = t("pickAmount"); return; }
  msg.textContent = "…";
  try {
    if (method === "cryptobot") {
      const d = await api("/api/topup/cryptobot", {amount});
      msg.textContent = t("payOpened");
      try { /^https:\/\/t\.me\//.test(d.url) ? Telegram.WebApp.openTelegramLink(d.url) : Telegram.WebApp.openLink(d.url); } catch(e) { window.open(d.url, "_blank"); }
      pollBalance();
    } else {
      const w = (await api("/api/methods"))[method];
      payInfo = {method, amount};
      $("payNote").textContent = t("payTo").replace("{a}", amount).replace("{c}", w.coin);
      $("payAddr").textContent = w.address;
      $("payBox").classList.remove("hidden");
      msg.textContent = "";
    }
  } catch(e) { msg.textContent = t(e.code || "noServer") + (e.detail ? " [" + e.detail + "]" : ""); }
}

function copyAddr() {
  const a = $("payAddr").textContent;
  const done = () => { $("topupMessage").textContent = t("copied"); };
  if (navigator.clipboard) navigator.clipboard.writeText(a).then(done, done);
  else { const i = document.createElement("input"); i.value = a; document.body.appendChild(i); i.select(); document.execCommand("copy"); i.remove(); done(); }
}

async function claimPay() {
  try {
    await api("/api/topup/claim", {method: payInfo.method, amount: payInfo.amount, txid: $("payTx").value.trim()});
    $("payBox").classList.add("hidden"); $("payTx").value = "";
    $("topupMessage").textContent = t("claimSent");
  } catch(e) { $("topupMessage").textContent = t(e.code || "noServer"); }
}

function pollBalance() {
  clearInterval(pollTimer);
  let n = 0;
  pollTimer = setInterval(async () => {
    n++;
    try {
      const u = (await api("/api/me")).user;
      if (ME && u.balance > ME.balance) {
        ME = u; updateProfile(); clearInterval(pollTimer);
        $("topupMessage").textContent = t("paidOk");
      }
    } catch(e) {}
    if (n > 120) clearInterval(pollTimer);
  }, 5000);
}

/* ===== Карточка товара ===== */
let curProduct = null, buying = false;
function openProduct(i) {
  curProduct = PRODUCTS[i];
  $("pmIcon").innerHTML = '<i data-lucide="' + curProduct[0] + '"></i>';
  $("pmName").textContent = curProduct[1];
  $("pmDesc").textContent = t(curProduct[2]);
  $("pmPrice").innerHTML = price(curProduct[4]) + '<div style="font-size:12px;color:var(--muted);font-weight:normal;margin-top:4px">≈ ' + usd(curProduct[4]) + ' $</div>';
  $("pmMessage").textContent = "";
  $("pmTopup").classList.add("hidden");
  $("productModal").classList.remove("hidden");
  icons();
}
function closeProduct() { $("productModal").classList.add("hidden"); }
async function buyProduct() {
  if (buying || !curProduct) return;
  buying = true;
  const msg = $("pmMessage");
  msg.textContent = "…";
  try {
    const d = await api("/api/buy", {product: curProduct[2]});
    ME = d.user; updateProfile();
    msg.textContent = t("buyDone");
  } catch(e) {
    if (e.code === "noFunds") {
      msg.textContent = t("noFunds").replace("{p}", usd(curProduct[4]));
      $("pmTopup").classList.remove("hidden");
    } else msg.textContent = t(e.code || "noServer") + (e.detail ? " [" + e.detail + "]" : "");
  }
  buying = false;
}

/* ===== Сервер ===== */
try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch(e) {}
const qApi = new URLSearchParams(location.search).get("api");
if (qApi) localStorage.setItem("zeusApi", qApi.replace(/\/+$/, ""));
const API = () => localStorage.getItem("zeusApi") || "";
let TOKEN = localStorage.getItem("zeusToken") || "", ME = null;

async function api(path, body) {
  if (!API()) throw Object.assign(new Error("noapi"), {code: "noServer"});
  const opt = {headers: {"Content-Type": "application/json"}};
  if (TOKEN) opt.headers.Authorization = "Bearer " + TOKEN;
  if (body) { opt.method = "POST"; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(API() + path, opt); }
  catch(err) { throw Object.assign(err, {code: "noServer", detail: "network"}); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || "error"), {status: r.status, code: d.error || "noServer", detail: d.detail || ("HTTP " + r.status)});
  return d;
}

function setMode(value) {
  mode = value;
  $("loginTab").classList.toggle("active", value==="login");
  $("registerTab").classList.toggle("active", value==="register");
  $("confirmField").classList.toggle("hidden", value!=="register");
  $("authButton").textContent = t(value==="register" ? "create" : "enter");
  $("authMessage").textContent = "";
}

async function submitAuth() {
  const login = $("username").value.trim(), password = $("password").value,
        confirm = $("confirmPassword").value, msg = $("authMessage");
  if (login.length < 3) { msg.textContent = t("min3"); return; }
  if (password.length < 4) { msg.textContent = t("min4"); return; }
  if (mode==="register" && password!==confirm) { msg.textContent = t("mismatch"); return; }
  try {
    const d = await api(mode==="register" ? "/api/register" : "/api/login", {login, password});
    TOKEN = d.token; ME = d.user;
    localStorage.setItem("zeusToken", TOKEN);
    $("authScreen").classList.add("hidden");
    if (ME.city) enterApp(); else $("cityScreen").classList.remove("hidden");
  } catch(e) { msg.textContent = t(e.code || "noServer"); }
}

/* ===== Поиск городов ===== */
async function findCities(query, container, message, callback) {
  if (query.length < 2) return;
  message.textContent = t("searching");
  container.innerHTML = "";
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=8&featuretype=city&countrycodes=ua,ru,pl"
      + "&accept-language=" + lang + "&q=" + encodeURIComponent(query);
    const results = await (await fetch(url)).json();
    container.innerHTML = "";
    if (!results.length) { message.textContent = t("notFound"); return; }
    message.textContent = t("pick");
    results.forEach(place => {
      const a = place.address || {};
      const name = a.city || a.town || a.village || a.municipality || place.name;
      const country = a.country || "";
      const item = document.createElement("div");
      item.className = "city-result";
      item.innerHTML = '<i data-lucide="map-pin"></i><span></span>';
      item.querySelector("span").textContent = name + ", " + country;
      item.onclick = () => callback({name, country});
      container.appendChild(item);
    });
    icons();
  } catch(e) { message.textContent = t("connErr"); }
}

function bindCity(inputId, resId, msgId, cb) {
  $(inputId).addEventListener("input", function() {
    clearTimeout(cityTimer);
    const v = this.value.trim();
    cityTimer = setTimeout(() => findCities(v, $(resId), $(msgId), cb), 500);
  });
}

async function setCity(city) {
  try { ME = (await api("/api/me", {city: city.name, country: city.country})).user; } catch(e) {}
}

async function saveFirstCity(city) { await setCity(city); $("cityScreen").classList.add("hidden"); enterApp(); }
async function saveNewCity(city) {
  await setCity(city);
  $("cityChangeBox").classList.add("hidden");
  $("newCityInput").value = ""; $("newCityResults").innerHTML = "";
  updateProfile();
}
function openCityChange() { $("cityChangeBox").classList.toggle("hidden"); }

bindCity("cityInput","cityResults","cityMessage",saveFirstCity);
bindCity("newCityInput","newCityResults","newCityMessage",saveNewCity);

/* ===== Приложение ===== */
function enterApp() {
  $("authScreen").classList.add("hidden");
  $("cityScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("bottomNav").classList.remove("hidden");
  updateProfile();
  showPage("products");
  if (ME && !ME.seenCommission) {
    ME.seenCommission = true;
    api("/api/me", {seenCommission: true}).catch(() => {});
    $("commissionBanner").classList.remove("hidden");
  }
  icons();
}

function updateProfile() {
  if (!ME) return;
  $("profileName").textContent = ME.login;
  $("profileCity").textContent = ME.city || t("notSet");
  $("currentCity").textContent = ME.city || t("notSet");
  $("headerCity").textContent = ME.city || t("yourCity");
  $("balanceValue").textContent = Number(ME.balance || 0).toFixed(2) + " $";
  $("themeSelect").value = ME.theme || "dark";
  document.body.classList.toggle("light", ME.theme==="light");
}

function showPage(page) {
  ["products","balance","profile"].forEach(n => $(n+"Page").classList.toggle("hidden", n!==page));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.page===page));
  icons();
}

function changeTheme(theme) {
  if (!ME) return;
  ME.theme = theme;
  api("/api/me", {theme}).catch(() => {});
  document.body.classList.toggle("light", theme==="light");
}

function logout() {
  TOKEN = ""; ME = null;
  localStorage.removeItem("zeusToken");
  $("app").classList.add("hidden");
  $("bottomNav").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
  $("username").value = $("password").value = $("confirmPassword").value = "";
  setMode("login");
}

/* ===== Порядок запуска: капча → язык → политика → вход ===== */
async function route() {
  if (!sessionStorage.getItem("zeusCaptcha")) { newCaptcha(); $("captchaScreen").classList.remove("hidden"); }
  else if (!lang) { $("langScreen").classList.remove("hidden"); }
  else if (!localStorage.getItem("zeusPrivacy")) { $("privacyBanner").classList.remove("hidden"); }
  else {
    if (TOKEN && !ME) {
      try { ME = (await api("/api/me")).user; }
      catch(e) { if (e.status===401) { TOKEN = ""; localStorage.removeItem("zeusToken"); } }
    }
    if (ME) { if (ME.city) enterApp(); else $("cityScreen").classList.remove("hidden"); }
    else {
      $("authScreen").classList.remove("hidden");
      try { await api("/api/health"); } catch(e) { $("authMessage").textContent = t("noServer"); }
    }
  }
  icons();
}

applyLang();

window.addEventListener("load", () => {
  setTimeout(() => {
    $("loader").style.opacity = "0";
    setTimeout(() => { $("loader").remove(); route(); }, 700);
  }, 2600);
});
</script>
